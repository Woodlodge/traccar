name: Build Release

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: preview

jobs:
  build-server:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          check-latest: true
          cache: gradle
      - run: ./gradlew assemble
      - name: Stage server payload
        shell: bash
        run: |
          mkdir -p out/{conf,lib,schema,templates}
          cp target/tracker-server.jar out/
          cp target/lib/* out/lib/
          cp schema/* out/schema/
          cp -r templates/* out/templates/
          cp setup/traccar.xml out/conf/
      - uses: actions/upload-artifact@v7
        with:
          name: staged-server
          path: out
          retention-days: 1

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: traccar/traccar-web
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Stage web payload
        shell: bash
        run: |
          mkdir -p out/web out/templates/translations
          cp -r build/* out/web/
          cp -r src/resources/l10n/* out/templates/translations/
      - uses: actions/upload-artifact@v7
        with:
          name: staged-web
          path: out
          retention-days: 1

  build-other:
    name: Build other zip
    needs: [build-server, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: staged-server
          path: setup/out
      - uses: actions/download-artifact@v8
        with:
          name: staged-web
          path: setup/out
      - name: Build zip
        shell: bash
        working-directory: setup
        run: |
          mkdir -p out/data out/logs
          cp README.txt out/
          (cd out && zip -q -r "../traccar-other-${{ github.ref_name }}.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: installers-other
          path: setup/traccar-other-*.zip
          compression-level: 0
          retention-days: 1

  docker:
    name: Docker
    needs: [build-other]
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v3'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'
      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v4'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: 'europe-west2-docker.pkg.dev'
      - uses: actions/download-artifact@v8
        with:
          name: installers-other
          path: docker
      - uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.alpine
          build-args: VERSION=${{ github.ref_name }}
          tags: europe-west2-docker.pkg.dev/woodlodge-api/traccar/traccar:${{ github.ref_name }}
          push: true
